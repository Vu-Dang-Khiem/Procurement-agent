- id: s19-vague-rejection
  group: human_loop
  actor: 17  # Cao Đình Nam, người tạo yêu cầu #12
  goal: "gui duyet don laptop da sua roi bao toi khi nao xong nhe"
  setup:
    # "Đã sửa": giảm từ 20 xuống 5 cái. Bản đầu dùng 8 cái, khi đó chỉ báo giá #8 vừa ngân sách, mà PDF của #8
