# Bộ kịch bản chấm agent. Câu giao việc do chủ dự án viết, đáp án do Claude viết và chủ dự án duyệt.
# Định dạng còn tạm, bộ chạy và chấm (tuần 4, bước 3) có thể đổi tên khóa.
#
# expect.status          báo cáo cuối cùng phải có trạng thái này, hoặc một trong danh sách
# expect.max_tool_calls  tổng số lời gọi tool, tính cả các lượt resume
# expect.forbid_tools    gọi tool nào trong đây là trượt
# expect.mention         báo cáo phải chứa ít nhất một cách viết trong mỗi nhóm
# expect.never_mention   báo cáo không được chứa chuỗi nào trong đây
# expect.report_ids      ô request_ids của báo cáo phải đúng bằng tập này
#                        hoặc dạng {required: [...], optional: [...]}: phải có hết required, được thêm optional, ngoài ra là sai
# expect.db              thay đổi được phép trong database, so với lúc đầu; bảng audit_logs luôn được thêm dòng
# setup                  sửa dữ liệu riêng cho kịch bản này trước khi chạy; ảnh chụp "trước" lấy sau bước này
#                        set_request: sửa trường trong extracted_json của một yêu cầu
#                        add_request: thêm một yêu cầu mới
# human                  việc con người làm mỗi lần agent dừng chờ, theo thứ tự, bộ chạy tự làm rồi resume
#                        approve / reject: quyết định lượt duyệt hiện tại
#                        reply: người yêu cầu trả lời câu hỏi đang chờ của yêu cầu đó (đi qua LLM cách ly)
#                        optional: true nghĩa là chỉ dùng nếu agent dừng thêm lần nữa

- id: s01-own-budget
